version: '3.8'

services:
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9092 || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 5

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  api-gateway:
    build:
      context: ./api_gateway
      dockerfile: Dockerfile
    ports:
      - "5001:8000"
    environment:
      - INVENTORY_URL=http://inventory-service:8002
      - AUTH_URL=http://auth-service:8003
      - CART_URL=http://cart-service:8004
      - PAYMENT_URL=http://payment-service:8005
      - ORDER_SERVICE_URL=http://order-service:8001
    depends_on:
      - inventory-service
      - auth-service
      - cart-service
      - payment-service
      - order-service
  inventory-service:
    build:
      context: ./inventory_service
      dockerfile: Dockerfile
    ports:
      - "8002:8002"
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - SAGA_ENABLED=true
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
    volumes:
      - ./inventory_service:/app/inventory_service
    depends_on:
      kafka:
        condition: service_healthy


  auth-service:
    build:
      context: ./auth_service
      dockerfile: Dockerfile
    ports:
      - "8003:8003"
    environment:
      - DB_PATH=/app/db/app.db
    volumes:
      - ./db:/app/db

  cart-service:
    build:
      context: ./cart_service
      dockerfile: Dockerfile
    ports:
      - "8004:8004"
    environment:
      - REDIS_URL=redis://redis:6379
      - INVENTORY_URL=http://inventory-service:8002
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - SAGA_ENABLED=true
    depends_on:
      redis:
        condition: service_started
      inventory-service:
        condition: service_started
      kafka:
        condition: service_healthy

  payment-service:
    build:
      context: ./payment_service
      dockerfile: Dockerfile
    ports:
      - "8005:8005"
    environment:
      - AUTH_DB_PATH=/app/db/app.db
      - INVENTORY_DB_PATH=/app/inventory_service/inventory.db
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - CART_URL=http://cart-service:8004
      - SAGA_ENABLED=true
    volumes:
      - ./db:/app/db
      - ./inventory_service:/app/inventory_service
    depends_on:
      kafka:
        condition: service_healthy
      auth-service:
        condition: service_started
      cart-service:
        condition: service_started
      inventory-service:
        condition: service_started

  order-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: order_db
    ports:
      - "5432:5432"

  order-service:
    build:
      context: ./order_service
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    environment:
      - DB_URL=jdbc:postgresql://order-db:5432/order_db
      - DB_USER=postgres
      - DB_PASS=postgres
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    depends_on:
      kafka:
        condition: service_healthy
      order-db:
        condition: service_started
